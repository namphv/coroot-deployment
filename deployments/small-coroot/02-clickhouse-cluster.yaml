apiVersion: "clickhouse.altinity.com/v1"
kind: "ClickHouseInstallation"
metadata:
  name: coroot-clickhouse
  namespace: coroot
spec:
  # Small efficient configuration: 1 shard, 2 replicas
  configuration:
    clusters:
      - name: coroot-cluster
        layout:
          shards:
            - name: "0"
              replicas:
                - name: "0"  # Anchor replica on regular node
                  templates:
                    podTemplate: anchor-pod-template
                    dataVolumeClaimTemplate: anchor-storage
                    logVolumeClaimTemplate: log-volume
                  settings:
                    # Lower resource settings for anchor (mostly idle)
                    background_pool_size: 8
                    background_schedule_pool_size: 8
                    max_concurrent_queries: 50
                - name: "1"  # Worker replica on spot node
                  templates:
                    podTemplate: worker-pod-template
                    dataVolumeClaimTemplate: worker-storage
                    logVolumeClaimTemplate: log-volume
                  settings:
                    # Higher resource settings for worker (handles most traffic)
                    background_pool_size: 24
                    background_schedule_pool_size: 24
                    max_concurrent_queries: 200

    # ClickHouse Keeper for replication
    zookeeper:
      nodes:
        - host: clickhouse-keeper-0.clickhouse-keeper-headless.coroot.svc.cluster.local
          port: 9181
        - host: clickhouse-keeper-1.clickhouse-keeper-headless.coroot.svc.cluster.local
          port: 9181
        - host: clickhouse-keeper-2.clickhouse-keeper-headless.coroot.svc.cluster.local
          port: 9181

    # Users
    users:
      default/password: ""
      default/networks/ip:
        - "::/0"
      default/profile: default

      coroot/password_sha256_hex: "ab9a68a6f38de96e1c995a43dba9b9d809945194e4461db8c325514d6efb582b"  # coroot123 - CHANGE THIS!
      coroot/networks/ip:
        - "::/0"
      coroot/profile: default

    # Profiles
    profiles:
      default/max_memory_usage: "4000000000"
      default/max_execution_time: "300"
      default/max_concurrent_queries_for_user: "50"
      default/max_threads: "4"

      anchor/max_memory_usage: "2000000000"
      anchor/max_bytes_before_external_group_by: "1000000000"
      anchor/max_threads: "2"

      worker/max_memory_usage: "10000000000"
      worker/max_execution_time: "300"
      worker/max_concurrent_queries_for_user: "200"
      worker/max_threads: "8"

    # Settings (global defaults, can be overridden per replica)
    settings:
      compression/case/method: zstd
      compression/case/level: 3
      background_merges_mutations_concurrency_ratio: 2
      number_of_free_entries_in_pool_to_execute_mutation: 10
      system_tables_lazy_load: "1"
      # Default pool sizes (overridden per replica)
      background_pool_size: 16
      background_schedule_pool_size: 16

    files:
      config.d/logs.xml: |
        <clickhouse>
          <logger>
            <level>information</level>
            <log>/var/log/clickhouse-server/clickhouse-server.log</log>
            <errorlog>/var/log/clickhouse-server/clickhouse-server.err.log</errorlog>
            <size>50M</size>
            <count>3</count>
          </logger>
        </clickhouse>

      config.d/dns_cache.xml: |
        <clickhouse>
          <!-- Set very long DNS cache update period (1 day = 86400 seconds) to minimize DNS lookups -->
          <dns_cache_update_period>86400</dns_cache_update_period>
          <!-- Disable internal DNS cache entirely - rely on system DNS cache -->
          <disable_internal_dns_cache>1</disable_internal_dns_cache>
        </clickhouse>

      config.d/network.xml: |
        <clickhouse>
          <!-- Only listen on IPv4 since cluster doesn't have IPv6 -->
          <listen_host>0.0.0.0</listen_host>
        </clickhouse>

  defaults:
    templates:
      podTemplate: anchor-pod-template
      dataVolumeClaimTemplate: anchor-storage
      logVolumeClaimTemplate: log-volume

  templates:
    podTemplates:
      # Anchor replica - regular node, minimal resources
      # Role: Replication + fallback during spot node downtime
      - name: anchor-pod-template
        spec:
          affinity:
            nodeAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                nodeSelectorTerms:
                  - matchExpressions:
                      - key: cloud.google.com/gke-spot
                        operator: DoesNotExist

          securityContext:
            runAsUser: 101
            runAsGroup: 101
            fsGroup: 101

          containers:
            - name: clickhouse
              image: clickhouse/clickhouse-server:24.11
              resources:
                requests:
                  cpu: 200m
                  memory: 500Mi
                limits:
                  memory: 800Mi

              volumeMounts:
                - name: anchor-storage
                  mountPath: /var/lib/clickhouse
                - name: log-volume
                  mountPath: /var/log/clickhouse-server

              livenessProbe:
                httpGet:
                  path: /ping
                  port: 8123
                initialDelaySeconds: 30
                periodSeconds: 10

              readinessProbe:
                httpGet:
                  path: /ping
                  port: 8123
                initialDelaySeconds: 10
                periodSeconds: 5

      # Worker replica - spot node, coexists with Chrome headless
      - name: worker-pod-template
        spec:
          affinity:
            nodeAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                nodeSelectorTerms:
                  - matchExpressions:
                      - key: cloud.google.com/gke-spot
                        operator: Exists

          tolerations:
            - effect: NoSchedule
              key: cloud.google.com/gke-spot
              operator: Equal
              value: "true"

          securityContext:
            runAsUser: 101
            runAsGroup: 101
            fsGroup: 101

          containers:
            - name: clickhouse
              image: clickhouse/clickhouse-server:24.11
              resources:
                requests:
                  cpu: 1500m      # Guaranteed minimum (Chrome has priority)
                  memory: 6Gi     # Guaranteed minimum
                limits:
                  # No CPU limit - can burst to use spare CPU when Chrome is idle
                  memory: 13Gi    # Hard cap: Chrome (12Gi) + ClickHouse (15Gi) = 27Gi < 27.6Gi available

              volumeMounts:
                - name: worker-storage
                  mountPath: /var/lib/clickhouse
                - name: log-volume
                  mountPath: /var/log/clickhouse-server

              livenessProbe:
                httpGet:
                  path: /ping
                  port: 8123
                initialDelaySeconds: 30
                periodSeconds: 10

              readinessProbe:
                httpGet:
                  path: /ping
                  port: 8123
                initialDelaySeconds: 10
                periodSeconds: 5

              lifecycle:
                preStop:
                  exec:
                    command:
                      - /bin/sh
                      - -c
                      - kill -TERM 1 && sleep 25

          terminationGracePeriodSeconds: 30

    volumeClaimTemplates:
      - name: anchor-storage
        spec:
          accessModes: [ReadWriteOnce]
          resources:
            requests:
              storage: 100Gi         # Match worker for full replication
          storageClassName: standard-rwo  # Cheaper than pd-ssd (anchor mostly idle)

      - name: worker-storage
        spec:
          accessModes: [ReadWriteOnce]
          resources:
            requests:
              storage: 100Gi
          storageClassName: standard-rwo

      - name: log-volume
        spec:
          accessModes: [ReadWriteOnce]
          resources:
            requests:
              storage: 5Gi
          storageClassName: standard-rwo
